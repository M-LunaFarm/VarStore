name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: varstore
          POSTGRES_PASSWORD: varstore-test
          POSTGRES_DB: varstore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U varstore"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VARSTORE_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/varstore
      VARSTORE_TEST_DB_USER: varstore
      VARSTORE_TEST_DB_PASSWORD: varstore-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm audit --audit-level=low
        working-directory: scripts/bots
      - run: python3 scripts/check-public-tree.py
      - run: ./gradlew build --console=plain
      - run: python3 scripts/record-contracts.py --output .local/ci-contracts.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification
          path: |
            **/build/reports/tests/
            **/build/test-results/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: varstore-distribution
          path: |
            varstore-paper/build/libs/*.jar
            varstore-api/build/libs/*.jar
            varstore-cache/build/libs/*.jar
            varstore-codec/build/libs/*.jar
            varstore-placeholderapi/build/libs/*.jar
            varstore-skript/build/libs/*.jar
            varstore-tools/build/libs/*.jar
            varstore-testkit/build/libs/*.jar
            examples/*/build/libs/*.jar
            !**/*-thin.jar
