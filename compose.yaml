services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: varstore
      POSTGRES_PASSWORD: ${VARSTORE_LOCAL_DB_PASSWORD:?Set a local test database password}
      POSTGRES_DB: varstore
    ports:
      - '127.0.0.1:25432:5432'
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U varstore']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres: {}
